<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="medallionGoldFavicon" cx="36%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fdf4d1"/>
      <stop offset="25%" stop-color="#eed18e"/>
      <stop offset="65%" stop-color="#cca054"/>
      <stop offset="100%" stop-color="#9a7031"/>
    </radialGradient>
    <radialGradient id="beadsGoldFavicon" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8df"/>
      <stop offset="60%" stop-color="#d6ab5b"/>
      <stop offset="100%" stop-color="#8a6125"/>
    </radialGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4a3319" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base do Medalhão Dourado -->
  <circle cx="50" cy="50" r="46" fill="url(#medallionGoldFavicon)" filter="url(#favShadow)"/>
  
  <!-- Borda de contas peroladas em relevo -->
  <circle cx="50" cy="50" r="42.5" fill="none" stroke="#68471b" stroke-width="2.2" stroke-dasharray="0.01 5.56" stroke-linecap="round" opacity="0.4"/>
  <circle cx="50" cy="50" r="42.5" fill="none" stroke="url(#beadsGoldFavicon)" stroke-width="1.8" stroke-dasharray="0.01 5.56" stroke-linecap="round"/>
  
  <!-- Anéis internos sutis -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#faecbe" stroke-width="0.8" opacity="0.8"/>
  <circle cx="50" cy="50" r="37.2" fill="none" stroke="#9d7334" stroke-width="0.6" opacity="0.45"/>

  <!-- Brilho acetinado superior -->
  <ellipse cx="40" cy="36" rx="20" ry="14" fill="#ffffff" opacity="0.22"/>

  <!-- Monograma Caligráfico M -->
  <text x="50" y="62" text-anchor="middle" font-family="'Parisienne', 'Brush Script MT', 'Great Vibes', cursive" font-size="40"
        fill="#66441b" font-weight="normal" style="paint-order:stroke; stroke:#f8eecf; stroke-width:0.5px;">M</text>
</svg>